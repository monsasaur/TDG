name: Tests

on:
  push:
    branches: [dev, feature/**]
  pull_request:
    branches: [dev]

jobs:
  express-api:
    name: Express API (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fall_detection_backend/express_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fall_detection_backend/express_api/package-lock.json

      - run: npm ci
      - run: npm test

  ml-service:
    name: ML Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fall_detection_backend/ml_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Install only what unit tests need — skip tensorflow (heavy, only needed by predict.py)
      - run: |
          pip install \
            numpy==1.26.4 \
            scipy==1.13.1 \
            pydantic==2.7.0 \
            pytest==9.0.3

      - run: pytest
