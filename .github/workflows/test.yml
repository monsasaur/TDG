name: Tests

on:
  push:
    branches: [dev, feature/**]
  pull_request:
    branches: [dev]

jobs:
  express-api:
    name: Express API (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fall_detection_backend/express_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fall_detection_backend/express_api/package-lock.json

      - run: npm ci
      - run: npm test

  ml-service:
    name: ML Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fall_detection_backend/ml_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Install only what unit tests need — skip tensorflow (heavy, only needed by predict.py)
      - run: |
          pip install \
            numpy==1.26.4 \
            scipy==1.13.1 \
            pydantic==2.7.0 \
            pytest==9.0.3

      - run: pytest

  # แอปมือถือยังไม่มี unit test — อย่างน้อยให้ type check + lint ทุก PR
  # (เปลี่ยนชนิดข้อมูลฝั่งหนึ่งแล้วลืมอีกฝั่ง หรือ import ผิด จะถูกจับก่อน merge)
  mobile-app:
    name: Mobile app (tsc + lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # --ignore-scripts: ไม่ต้อง build native อะไร แค่ตรวจโค้ด
      # --force: package.json มี lightningcss-darwin-arm64 เป็น dependency ตรง (ตัวสำหรับ Mac)
      #          บน Linux npm ci จะล้มด้วย EBADPLATFORM — ข้ามการตรวจแพลตฟอร์ม ไฟล์นั้นไม่ได้ถูกใช้
      - run: npm ci --ignore-scripts --force
      - run: npx tsc --noEmit
      - run: npm run lint
