# Render Blueprint — deploy ทั้งสอง service จาก repo นี้
# ใช้โดยไปที่ Render → New → Blueprint แล้วชี้มาที่ repo
#
# ⚠️ ตอนนี้ตั้งเป็นแผนฟรีสำหรับช่วง demo (2026-11-17) — ไม่เหมาะกับใช้งานจริง:
#    หลับหลังไม่มีคนเรียก 15 นาที (ตื่นราว 1 นาที) · 750 ชม./เดือนต่อ workspace · รับ private network ไม่ได้
#    → Express เรียก ML ผ่าน URL สาธารณะ (ML_SERVICE_URL กรอกเอง) · ก่อน demo ปลุกด้วย express_api/scripts/warm_render.sh
#    ขึ้นแผนเสียเงิน: plan → starter ทั้งสองตัว · ML_SERVICE_URL กลับไปใช้ fromService hostport · ลบ ML_TIMEOUT_MS
#    รายละเอียด docs/reports/deploy_render_checklist.md หัวข้อ "แผนฟรีช่วง demo"
#
# ไฟล์โมเดล models/*.pkl ถูก gitignore ไว้ — Dockerfile ของ ml_service ดาวน์โหลดจาก GitHub Release
#    ตาม fall_detection_backend/ml_service/models/MANIFEST (ตรวจ sha256) · ขั้นตอนทั้งหมด docs/reports/deploy_render_checklist.md

services:
  - type: web
    name: tdg-ml-service
    runtime: docker
    dockerfilePath: ./fall_detection_backend/ml_service/Dockerfile
    dockerContext: ./fall_detection_backend/ml_service
    healthCheckPath: /health
    plan: free          # demo · ใช้งานจริง = starter
    envVars:
      - key: CSI_WINDOW_SIZE
        value: "200"
      - key: CSI_STRIDE
        value: "50"
      - key: CSI_SEQUENCE_LEN
        value: "10"
      # rf_v2_event = รุ่น 2 (39 ค่า · รับจาก fall_monitor.py) · rf_v1 = รุ่นแรก (416 ค่า)
      # image มีไฟล์ของทั้งสองรุ่น — สลับได้ด้วยค่านี้อย่างเดียว ไม่ต้อง build ใหม่
      - key: FALL_MODEL
        value: rf_v2_event

  - type: web
    name: tdg-express-api
    runtime: docker
    dockerfilePath: ./fall_detection_backend/express_api/Dockerfile
    dockerContext: ./fall_detection_backend/express_api
    healthCheckPath: /health
    plan: free          # demo · ใช้งานจริง = starter
    envVars:
      # แผนฟรีรับ private network ไม่ได้ → กรอก URL สาธารณะของ tdg-ml-service เอง
      # เช่น https://tdg-ml-service.onrender.com (ดู URL จริงในหน้า service — ถ้าชื่อซ้ำ Render จะต่อท้ายให้)
      # ขึ้นแผนเสียเงินแล้วเปลี่ยนกลับเป็น:
      #   fromService: { name: tdg-ml-service, type: web, property: hostport }
      - key: ML_SERVICE_URL
        sync: false
      # รอ ML service ที่กำลังตื่นได้ 90 วิ (ค่าเริ่มต้น 5 วิ ซึ่งสั้นกว่าเวลาตื่นของแผนฟรี)
      - key: ML_TIMEOUT_MS
        value: "90000"

      # ค่าที่ต้องกรอกเองใน Render dashboard (sync: false = ไม่เก็บไว้ในไฟล์นี้)
      # คีย์แยกตามผู้เรียก — ตั้งให้ครบใน production ไม่งั้นทุก scope ถอยไปใช้ API_KEY ตัวเดียว
      # แล้วคีย์ที่ฝังในแอปจะสั่ง demo/fire (โทรออกจริง) ได้ · ดู src/middleware/auth.js
      - key: API_KEY
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: DEMO_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # ต้องเป็น service_role (ไม่ใช่ anon) — หลังรัน accounts.sql คีย์อื่นเขียน fall_events / alerts ไม่ได้
      - key: SUPABASE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: ALERT_PHONES
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_ORIGINS
        sync: false
      # AI ร่างข้อความโทรแจ้ง (Phase 2a) — ปิดไว้จนกว่าจะตัดสินใจเปิด · เปิดต้องมี TYPHOON_API_KEY
      - key: TYPHOON_API_KEY
        sync: false

      # ค่าที่ตั้งไว้ตายตัวได้
      - key: TWILIO_MODE
        value: real
      - key: PUSH_MODE
        value: real
      - key: USE_MOCK_ML
        value: "false"
      - key: AI_VOICE_ENABLED
        value: "false"
      - key: ACK_TIMEOUT_SECONDS
        value: "60"
      - key: COOLDOWN_SECONDS
        value: "300"
      - key: ESCALATION_SWEEP_SECONDS
        value: "60"
      - key: ADMIN_SESSION_HOURS
        value: "8"
      - key: DEVICE_OFFLINE_AFTER_MINUTES
        value: "15"
      - key: ADMIN_TZ_OFFSET_HOURS
        value: "7"
